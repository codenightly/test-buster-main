name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  wheel:
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Check the metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing. No API token lives in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish the GitHub release
    needs: [wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Write the release notes
        run: |
          cat > notes.md <<'EOF'
          ## Test Buster! ${{ github.ref_name }}

          ### Install

          The package on PyPI puts a `testbuster` command on your PATH:

          ```bash
          pipx install test-buster
          ```

          Or with uv:

          ```bash
          uv tool install test-buster
          ```

          ### Optional extras

          ```bash
          pipx install 'test-buster[http2]'   # HTTP/2 through httpx
          pipx install 'test-buster[socks]'   # SOCKS4 and SOCKS5 proxies
          pipx install 'test-buster[yaml]'    # YAML scenario files
          pipx install 'test-buster[speed]'   # uvloop, Linux and macOS only
          pipx install 'test-buster[all]'     # every runtime extra at once
          ```
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: Test Buster! ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          draft: false
          prerelease: false
